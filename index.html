<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beat Drop: Tapori Takeover</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <h1>🎵 BEAT DROP: TAPORI TAKEOVER 🎵</h1>
        <div id="stats">
            <div>Score: <span id="score">0</span></div>
            <div>Lives: <span id="lives">❤️❤️❤️</span></div>
        </div>
        
        <div id="stage">
            <div id="enemy" class="idle">🕺</div>
            <div id="effect-text"></div>
        </div>

        <div id="controls">
            <button id="tap-btn" onclick="tapAction()">HIT ON BEAT! 🔥</button>
        </div>
        
        <audio id="bg-music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" preload="auto" loop></audio>
    </div>

    <script src="script.js"></script>
</body>
</html>
